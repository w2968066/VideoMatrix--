name: Build VideoMatrix Installer (Windows)

# Builds a self-contained Windows installer (NSIS .exe) for the
# Electron + FastAPI + ffmpeg architecture. Users double-click the
# resulting Setup.exe — no Python required.

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag to upload the installer to"
        required: true
        default: "v2.6.0"
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ── Python toolchain ─────────────────────────────────────────────────
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install backend deps + PyInstaller
        shell: pwsh
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pyinstaller pytest

      # ── Bundle ffmpeg next to the backend so PyInstaller sweeps it in ────
      - name: Download FFmpeg static build
        shell: pwsh
        run: |
          $url = "https://github.com/GyanD/codexffmpeg/releases/download/8.1.1/ffmpeg-8.1.1-full_build.7z"
          Invoke-WebRequest -Uri $url -OutFile ffmpeg.7z
          7z x ffmpeg.7z -offmpeg-extracted -y
          if ($LASTEXITCODE -ne 0) { throw "FFmpeg extraction failed" }
          $bin = Get-ChildItem -Path ffmpeg-extracted -Recurse -Filter ffmpeg.exe | Select-Object -First 1 -ExpandProperty DirectoryName
          New-Item -ItemType Directory -Force -Path backend/ffmpeg | Out-Null
          Copy-Item "$bin\ffmpeg.exe"  backend/ffmpeg/
          Copy-Item "$bin\ffprobe.exe" backend/ffmpeg/
          if ((Get-FileHash backend/ffmpeg/ffmpeg.exe).Hash -ne "09948D4CDD0650DA6FF5A87577469F2A218DC2615AE379F8F734D24C49DE0F73") { throw "FFmpeg differs from verified build" }
          if ((Get-FileHash backend/ffmpeg/ffprobe.exe).Hash -ne "A6618E99BB58869DED3C6F37B53AA1A8D701C3591DBB7B5B317D47369C112BE2") { throw "FFprobe differs from verified build" }

      - name: Test backend regressions
        working-directory: backend
        run: python -m pytest tests/test_bgm_tracks.py tests/test_audio_duration.py tests/test_runtime_startup.py tests/test_variant_task_service.py tests/test_full_hook.py tests/test_grouped_body_and_cover.py tests/test_subtitle.py tests/test_video_variant.py tests/test_benchmark_session.py tests/test_ffmpeg_diagnostics.py tests/test_hardware_recovery.py tests/test_dedup_plan.py tests/test_dedup_renderer.py tests/test_dedup_integration.py tests/test_dedup_blend_eof.py tests/test_random_output.py tests/test_random_output_hardware.py tests/test_fused_cover.py -q

      # ── Backend → single .exe (ffmpeg + uvicorn + fastapi bundled) ───────
      - name: Build backend binary
        shell: pwsh
        working-directory: backend
        run: pyinstaller --clean videomatrix-backend.spec

      - name: Verify packaged backend identity and shutdown
        shell: pwsh
        working-directory: backend
        run: |
          $env:VIDEOMATRIX_TEST_BINARY = (Resolve-Path dist/videomatrix-backend.exe).Path
          python -m pytest tests/test_runtime_startup.py -q

      # ── Node toolchain ───────────────────────────────────────────────────
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend deps
        working-directory: frontend
        run: npm ci

      - name: Build renderer / main / preload
        working-directory: frontend
        run: |
          node --test tests/runtime.test.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run build

      # ── Frontend installer (NSIS) — pulls backend exe in via extraResources
      - name: Package Electron app
        working-directory: frontend
        run: npx electron-builder --win --publish never

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: VideoMatrix-windows-installer
          path: frontend/release/*.exe

      - name: Upload to GitHub Release
        if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ github.event.inputs.release_tag }}"
          if ([string]::IsNullOrWhiteSpace($tag)) { $tag = "${{ github.ref_name }}" }
          gh release view $tag --repo $env:GITHUB_REPOSITORY 2>$null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag --repo $env:GITHUB_REPOSITORY `
              --draft --title "VideoMatrix $($tag.TrimStart('v'))" `
              --notes "Self-contained Windows installer (Electron + FastAPI + ffmpeg, no Python required)."
          }
          $installer = Get-ChildItem -Path frontend/release -Filter "*.exe" | Select-Object -First 1
          $version = (Get-Content frontend/package.json -Raw | ConvertFrom-Json).version
          $uploadPath = Join-Path $installer.DirectoryName "VideoMatrix.Setup.$version.exe"
          Copy-Item -LiteralPath $installer.FullName -Destination $uploadPath -Force
          gh release upload $tag $uploadPath --repo $env:GITHUB_REPOSITORY --clobber
